<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You & Me - HeartBeat</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
}

.texto {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #ffd6df;
    pointer-events: none;
    text-shadow:
        0 0 8px #ff5577,
        0 0 20px rgba(255, 30, 80, .8);
}

.titulo {
    font-family: Georgia, serif;
    font-size: clamp(18px, 4vw, 31px);
    letter-spacing: 6px;
    margin-bottom: 16px;
}

.subtitulo {
    font-family: Georgia, serif;
    font-size: clamp(8px, 2vw, 13px);
    letter-spacing: 5px;
    color: #ffb5c5;
}

.indicacion {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 180, 195, .6);
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="texto">
    <div class="titulo">YOU &amp; ME</div>
    <div class="subtitulo">WRITTEN IN THE STARS</div>
</div>

<div class="indicacion">TOCA LA PANTALLA ♥</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;
let dpr;

let heartParticles = [];
let stars = [];

let time = 0;
let clickPulse = 0;


/* =====================================
   TAMAÑO
===================================== */

function resize() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createStars();
    createHeart();
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================
   ESTRELLAS
===================================== */

function createStars() {

    stars = [];

    const amount = Math.floor(
        width * height / 6500
    );

    for (let i = 0; i < amount; i++) {

        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.4 + .25,
            alpha: Math.random() * .7 + .15,
            speed: Math.random() * 2 + 1,
            phase: Math.random() * Math.PI * 2
        });
    }
}


/* =====================================
   ECUACIÓN DEL CORAZÓN
===================================== */

function heartPosition(t, scale) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * scale,
        y: -y * scale
    };
}


/* =====================================
   PARTÍCULAS DEL BORDE
===================================== */

function createHeart() {

    heartParticles = [];

    const scale =
        Math.min(width, height) / 39;

    const amount =
        Math.min(
            1300,
            Math.max(500, Math.floor(width / 1.1))
        );

    for (let i = 0; i < amount; i++) {

        const t =
            (i / amount) *
            Math.PI * 2;

        const p =
            heartPosition(t, scale);

        /*
          Pequeña variación para que el borde
          parezca hecho de polvo brillante.
        */

        const jitter =
            (Math.random() - .5) * 3.5;

        heartParticles.push({

            angle: t,

            x: width / 2 + p.x + jitter,

            y: height / 2 + p.y + jitter,

            baseX: width / 2 + p.x,

            baseY: height / 2 + p.y,

            size:
                Math.random() * 1.8 + .5,

            alpha:
                Math.random() * .7 + .3,

            phase:
                Math.random() *
                Math.PI * 2,

            speed:
                Math.random() * 2 + 1
        });
    }
}


/* =====================================
   DIBUJAR ESTRELLAS
===================================== */

function drawStars() {

    for (const star of stars) {

        const twinkle =
            star.alpha +
            Math.sin(
                time * star.speed +
                star.phase
            ) * .25;

        ctx.globalAlpha =
            Math.max(.05, twinkle);

        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   CORAZÓN
===================================== */

function drawHeart() {

    /*
      Latido:
      dos golpes rápidos como un corazón real.
    */

    const beat1 =
        Math.pow(
            Math.max(
                0,
                Math.sin(time * 3.5)
            ),
            16
        );

    const beat2 =
        Math.pow(
            Math.max(
                0,
                Math.sin(time * 3.5 - .75)
            ),
            22
        );

    const pulse =
        1
        + beat1 * .045
        + beat2 * .075
        + clickPulse * .14;

    const glow =
        0.8
        + beat1 * 1.8
        + beat2 * 2.4
        + clickPulse * 2;


    /* -------------------------------
       BRILLO INTERIOR
    -------------------------------- */

    const gradient =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            10,
            width / 2,
            height / 2,
            Math.min(width, height) * .38
        );

    gradient.addColorStop(
        0,
        `rgba(255, 35, 85, ${.16 * glow})`
    );

    gradient.addColorStop(
        .35,
        `rgba(255, 20, 70, ${.09 * glow})`
    );

    gradient.addColorStop(
        1,
        "rgba(255, 0, 50, 0)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* -------------------------------
       PARTÍCULAS
    -------------------------------- */

    for (const p of heartParticles) {

        const x =
            width / 2 +
            (p.baseX - width / 2) *
            pulse;

        const y =
            height / 2 +
            (p.baseY - height / 2) *
            pulse;

        const flicker =
            .55 +
            Math.sin(
                time * p.speed +
                p.phase
            ) * .35;

        const alpha =
            Math.max(
                .15,
                flicker
            );


        /*
          Halo grande
        */

        ctx.shadowBlur =
            12 + glow * 7;

        ctx.shadowColor =
            "#ff315f";

        ctx.fillStyle =
            `rgba(255, ${70 + Math.random() * 45}, ${110 + Math.random() * 45}, ${alpha})`;

        ctx.globalAlpha = alpha;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size *
            (1 + glow * .12),
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
          Algunas partículas blancas
          para dar el aspecto de brillo.
        */

        if (
            Math.random() < .045
        ) {

            ctx.fillStyle =
                "#fff1f5";

            ctx.shadowBlur = 18;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                p.size * 1.4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}


/* =====================================
   ANIMACIÓN
===================================== */

function animate() {

    time += .016;

    ctx.fillStyle =
        "rgba(0, 0, 0, .24)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    drawStars();
    drawHeart();

    /*
      El pulso extra desaparece poco a poco.
    */

    clickPulse *= .92;

    requestAnimationFrame(
        animate
    );
}


/* =====================================
   INTERACCIÓN
===================================== */

function pulseHeart() {

    clickPulse = 1;
}

window.addEventListener(
    "click",
    pulseHeart
);

window.addEventListener(
    "touchstart",
    pulseHeart,
    { passive: true }
);


/* =====================================
   INICIO
===================================== */

resize();
animate();

</script>

</body>
</html>
