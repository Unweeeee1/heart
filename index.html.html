<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>You & Me - HeartBeat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Georgia,serif}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
.texto{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;text-align:center;color:#ffdbe4;pointer-events:none;text-shadow:0 0 8px #ff5577,0 0 22px rgba(255,40,90,.9)}
.titulo{font-size:clamp(22px,7vw,42px);letter-spacing:clamp(3px,1.5vw,8px);margin-bottom:14px;white-space:nowrap}
.subtitulo{font-size:clamp(9px,2.8vw,15px);letter-spacing:clamp(2px,1vw,5px);color:#ffb8c8;white-space:nowrap}
.indicacion{position:fixed;z-index:3;bottom:24px;left:50%;transform:translateX(-50%);width:100%;text-align:center;color:rgba(255,190,205,.65);font-family:Arial,sans-serif;font-size:11px;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="texto"><div class="titulo">YOU &amp; ME</div><div class="subtitulo">WRITTEN IN THE STARS</div></div>
<div class="indicacion">TOCA LA PANTALLA ♥</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
var width=0,height=0,dpr=1;
var stars=[],heart=[];
var time=0,pulse=0;

function resize(){
  width=window.innerWidth||document.documentElement.clientWidth||360;
  height=window.innerHeight||document.documentElement.clientHeight||640;
  dpr=window.devicePixelRatio||1;
  if(dpr>2)dpr=2;
  canvas.width=Math.max(1,Math.floor(width*dpr));
  canvas.height=Math.max(1,Math.floor(height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  makeStars();
  makeHeart();
}

function makeStars(){
  stars=[];
  var count=Math.max(80,Math.min(220,Math.floor(width*height/5000)));
  for(var i=0;i<count;i++){
    stars.push({
      x:Math.random()*width,
      y:Math.random()*height,
      r:Math.random()*1.25+0.25,
      a:Math.random()*0.65+0.15,
      speed:Math.random()*2+0.5,
      phase:Math.random()*Math.PI*2
    });
  }
}

function heartPoint(t,scale){
  var x=16*Math.pow(Math.sin(t),3);
  var y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return {x:x*scale,y:-y*scale};
}

function makeHeart(){
  heart=[];
  var scale=Math.min(width,height)/42;
  var count=Math.max(700,Math.min(1500,Math.floor(width*1.8)));
  for(var i=0;i<count;i++){
    var t=(i/count)*Math.PI*2;
    var p=heartPoint(t,scale);
    var jitter=(Math.random()-0.5)*2.8;
    heart.push({
      x:p.x+jitter,
      y:p.y+jitter,
      size:Math.random()*1.7+0.45,
      alpha:Math.random()*0.65+0.35,
      phase:Math.random()*Math.PI*2,
      speed:Math.random()*2+0.8
    });
  }
}

function drawStars(){
  ctx.save();
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var a=s.a+Math.sin(time*s.speed+s.phase)*0.2;
    if(a<0.04)a=0.04;
    ctx.globalAlpha=a;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawHeart(){
  var b1=Math.pow(Math.max(0,Math.sin(time*3.2)),18);
  var b2=Math.pow(Math.max(0,Math.sin(time*3.2-0.7)),24);
  var scale=1+b1*0.045+b2*0.075+pulse*0.14;
  var glow=1+b1*1.6+b2*2.2+pulse*2;
  var cx=width/2,cy=height/2;

  var g=ctx.createRadialGradient(cx,cy,5,cx,cy,Math.min(width,height)*0.42);
  g.addColorStop(0,'rgba(255,25,75,'+(0.12*glow)+')');
  g.addColorStop(0.4,'rgba(255,15,65,'+(0.07*glow)+')');
  g.addColorStop(1,'rgba(255,0,50,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,width,height);

  ctx.save();
  ctx.shadowColor='#ff315f';
  ctx.shadowBlur=10+glow*6;
  for(var i=0;i<heart.length;i++){
    var p=heart[i];
    var x=cx+p.x*scale;
    var y=cy+p.y*scale;
    var a=p.alpha+Math.sin(time*p.speed+p.phase)*0.22;
    if(a<0.08)a=0.08;
    ctx.globalAlpha=Math.min(1,a);
    ctx.fillStyle=(i%23===0)?'#fff3f6':'#ff4d73';
    ctx.beginPath();
    ctx.arc(x,y,p.size*(1+glow*0.10),0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function frame(){
  time+=0.016;
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,0.30)';
  ctx.fillRect(0,0,width,height);
  drawStars();
  drawHeart();
  pulse*=0.91;
  if(pulse<0.001)pulse=0;
  requestAnimationFrame(frame);
}

function doPulse(){pulse=1;}
window.addEventListener('resize',resize);
window.addEventListener('click',doPulse);
window.addEventListener('touchstart',doPulse,{passive:true});
resize();
ctx.fillStyle='#000';
ctx.fillRect(0,0,width,height);
frame();
})();
</script>
</body>
</html>
